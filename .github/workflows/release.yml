name: Release

on:
  push:
    branches:
      - main
      - v*
      - dev*
    tags:
      - "v*"
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
        include:
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
      fail-fast: false

    runs-on: ubuntu-24.04
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            date=$(git log -1 --format="%cd" --date=short | sed s/-//g)
            count=$(git rev-list --count HEAD)
            commit=$(git rev-parse --short HEAD)
            version="test-$date.r${count}.$commit"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Show workflow information
        id: get_filename
        run: |
          asset_name=$(jq -er --arg target "$GOOS-$GOARCH$GOARM" '.[$target].friendlyName' release/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, RELEASE_NAME: $asset_name"
          echo "ASSET_NAME=$asset_name" >> "$GITHUB_OUTPUT"
          echo "ASSET_NAME=$asset_name" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Get project dependencies
        run: go mod download

      - name: Test
        if: matrix.goarch == 'amd64'
        run: go test ./...

      - name: Build gg
        run: |
          go build -v -o "gg-$ASSET_NAME" -trimpath -ldflags "-X github.com/mzz2017/gg/cmd.Version=$VERSION -s -w -buildid=" .
          upx "gg-$ASSET_NAME"

      - name: Smoke test
        if: matrix.goarch == 'amd64'
        run: ./gg-"$ASSET_NAME" --version

      - name: Checksums
        run: |
          FILE=./gg-$ASSET_NAME
          DGST=$FILE.dgst
          openssl dgst -md5    "$FILE" | sed 's/([^)]*)//g' > "$DGST"
          openssl dgst -sha1   "$FILE" | sed 's/([^)]*)//g' >> "$DGST"
          openssl dgst -sha256 "$FILE" | sed 's/([^)]*)//g' >> "$DGST"
          openssl dgst -sha512 "$FILE" | sed 's/([^)]*)//g' >> "$DGST"
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gg-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            gg-${{ steps.get_filename.outputs.ASSET_NAME }}
            gg-${{ steps.get_filename.outputs.ASSET_NAME }}.dgst
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # 同一标签串行发布，避免重跑时同时修改草稿附件。
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gg-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi

          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            # 已发布的版本不覆盖；上传失败留下的草稿可以在重跑时继续完成。
            if [[ "$is_draft" != true ]]; then
              echo "Release $TAG is already published; skipping."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "$TAG" --generate-notes --prerelease="$prerelease"
          fi

          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --prerelease="$prerelease"
